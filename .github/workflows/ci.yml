name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore InventoryManagementSystem.slnx

      - name: Build
        run: dotnet build InventoryManagementSystem.slnx --no-restore --configuration Release

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-ui
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: inventory-ui/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build Angular app
        run: npm run build