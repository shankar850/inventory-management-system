<h2>Products</h2>
<p><a routerLink="/products/new">+ Add product</a></p>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>SKU</th>
      <th>Category</th>
      <th>Price</th>
      <th>Stock</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.sku }}</td>
        <td>{{ p.categoryName }}</td>
        <td>{{ p.price | currency:'INR' }}</td>
        <td>{{ p.quantityInStock }}</td>
      </tr>
    } @empty {
      <tr><td colspan="5">No products found</td></tr>
    }
  </tbody>
</table>
