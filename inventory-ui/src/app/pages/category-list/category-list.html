<h2>Categories</h2>
<p><a routerLink="/categories/new"></a>+ Add Category</p>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>name</th>
      <th>Products</th>
    </tr>
  </thead>
  <tbody>
    @for (c of categories(); track c.id) {
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.productCount }}</td>
      </tr>
    } @empty {
      <tr><td colspan="3">No categories found</td></tr>
    }
  </tbody>
</table>
