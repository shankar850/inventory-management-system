<h2>Categories</h2>
<p><a routerLink="/categories/new">+ Add category</a></p>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Products</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (c of categories(); track c.id) {
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.productCount }}</td>
        <td>
          <a [routerLink]="['/categories', c.id, 'edit']">Edit</a>
          @if (auth.isAdmin()) {
            <button type="button" (click)="remove(c)">Delete</button>
          }
        </td>
      </tr>
    } @empty {
      <tr><td colspan="4">No categories found</td></tr>
    }
  </tbody>
</table>
