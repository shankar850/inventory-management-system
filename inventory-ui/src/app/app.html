<h1>Inventory Management System</h1>

@if (auth.isLoggedIn()) {
  <nav>
    <a routerLink="/products">Products</a> |
    <a routerLink="/categories">Categories</a> |
    <span>{{ auth.username() }} ({{ auth.role() }})</span>
    <button type="button" (click)="auth.logout()">Logout</button>
  </nav>
}

<router-outlet />
